server {
    listen 80;
    listen [::]:80;
    server_name oneshowseo.com www.oneshowseo.com;
    return 301 https://oneshowseo.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name oneshowseo.com www.oneshowseo.com;

    ssl_certificate /etc/letsencrypt/live/oneshowseo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oneshowseo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 25m;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=()" always;
}
