<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>正在切换到 OneShowSEO</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.6 system-ui, sans-serif; color: #12162b; background: #f7f8fc; }
      main { width: min(440px, calc(100% - 48px)); padding: 40px; border: 1px solid #e4e7f2; border-radius: 20px; background: white; box-shadow: 0 18px 60px rgba(31, 38, 86, .08); text-align: center; }
      h1 { margin: 0 0 10px; font-size: 25px; }
      p { margin: 0; color: #667085; }
    </style>
  </head>
  <body>
    <main>
      <h1>正在进入 OneShowSEO</h1>
      <p id="status">正在清理旧产品页面缓存…</p>
    </main>
    <script>
      (async () => {
        try {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }
        } finally {
          document.getElementById('status').textContent = '清理完成，正在加载 OneShowSEO…';
          window.setTimeout(() => {
            window.location.replace('/?product=oneshowseo&release=a2f618f');
          }, 350);
        }
      })();
    </script>
  </body>
</html>
