server {
    listen 80;
    listen [::]:80;
    server_name gameforcast.top www.gameforcast.top;

    # Keep the temporary test-domain redirect non-permanent so it cannot pin
    # one product to another in browser caches.
    return 302 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gameforcast.top www.gameforcast.top;

    ssl_certificate /etc/letsencrypt/live/gameforcast.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gameforcast.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    # A one-time recovery URL for browsers that previously cached the Growth
    # site on this temporary SEO domain. It keeps cookies/local sessions while
    # removing Cache Storage and unregistering stale service workers.
    location = /__reset-product-cache {
        alias /var/www/oneshowseo/deploy/reset-product-cache.html;
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Clear-Site-Data '"cache"' always;
    }

    # Tombstone the common legacy service-worker URLs so an old Growth worker
    # cannot take control of this domain again.
    location = /service-worker.js {
        alias /var/www/oneshowseo/deploy/service-worker-tombstone.js;
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location = /sw.js {
        alias /var/www/oneshowseo/deploy/service-worker-tombstone.js;
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 25m;
    }
}
